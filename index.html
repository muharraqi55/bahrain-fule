<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة البنزين – البحرين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{--bg1:#f3efe6;--bg2:#e4ecf0;--card:rgba(255,255,255,.72);--ink:#14213d;--mut:#5c6678;--line:rgba(20,33,61,.12);--acc:#16a34a;--track:rgba(20,33,61,.1);color-scheme:light dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1220;--bg2:#13202e;--card:rgba(255,255,255,.06);--ink:#eef2f7;--mut:#93a0b5;--line:rgba(255,255,255,.12);--track:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg1:#0b1220;--bg2:#13202e;--card:rgba(255,255,255,.06);--ink:#eef2f7;--mut:#93a0b5;--line:rgba(255,255,255,.12);--track:rgba(255,255,255,.1);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;overflow-x:hidden;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--acc) 28%,transparent),transparent),linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1)}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--acc);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 45%,transparent);transition:background .4s}
h1{font-size:22px;font-weight:900;margin:0;line-height:1.2}
h2{font-size:17px;font-weight:900;margin:0 0 12px}
header p{margin:0;color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.bar select{flex:1;min-width:0}
select{font:700 14px 'Cairo',sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;height:42px}
.ib{all:unset;box-sizing:border-box;cursor:pointer;min-width:42px;height:42px;padding:0 10px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;font:800 15px 'Cairo',sans-serif;background:var(--card);color:var(--ink)}
.card{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:14px}
.fuels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fuel{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:14px 6px 12px;border-radius:18px;border:2px solid var(--line);position:relative;transition:transform .2s,border-color .2s,background .2s;min-width:0}
.fuel:hover{transform:translateY(-2px)}
.fuel .g{font-size:34px;font-weight:900;line-height:1;color:var(--c)}
.fuel .n{font-size:12px;color:var(--mut);margin-top:2px}
.fuel .p{font-size:14px;font-weight:800;margin-top:8px}
.fuel.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.spark{display:block;margin:4px auto 0;color:var(--mut);opacity:.7}
.trend{font-size:11px;margin-inline-start:2px}
.trend-up{color:#dc2626}.trend-down{color:#16a34a}.trend-flat{color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin:10px 2px 0;line-height:1.7}
.note button{all:unset;cursor:pointer;color:var(--acc);font-weight:800;text-decoration:underline;margin-inline-start:6px}
.note summary{cursor:pointer;font-weight:700}
.note ul{margin:8px 0 0;padding-inline-start:18px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid>*,.hero>*{min-width:0}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600;line-height:1.5}
.in{display:flex;align-items:center;width:100%;min-width:0;border:1.5px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--card) 70%,transparent);padding:0 12px;transition:border-color .2s}
.in:focus-within{border-color:var(--acc)}
.in input{all:unset;box-sizing:border-box;flex:1 1 0;width:100%;min-width:0;padding:12px 0;font:800 20px 'Cairo',sans-serif;color:var(--ink);direction:ltr;text-align:right}
.in input.txt{direction:inherit;text-align:start;font-size:17px}
.in span{flex:none;color:var(--mut);font-size:13px;margin-inline-start:8px}
.pencil{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;font-size:13px;color:var(--mut);margin-inline-start:4px;transition:background .15s,color .15s}
.pencil:hover{background:var(--track);color:var(--ink)}
.full{grid-column:1/-1}
input[type=range]{display:block;width:100%;min-width:0;accent-color:var(--acc);height:28px;margin:8px 0 0}
.q{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:900;margin-inline-start:4px;vertical-align:middle}
.help{border:1.5px dashed var(--acc);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.9;background:color-mix(in srgb,var(--acc) 8%,transparent)}
.help[hidden]{display:none}
.help b{color:var(--acc)}
.help ol{margin:6px 0 0;padding-inline-start:20px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media(max-width:520px){
  .wrap{padding:16px 12px 50px}
  .card{padding:14px;border-radius:18px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .grid{gap:10px}
  .in{padding:0 10px}
  .in input{font-size:18px;padding:10px 0}
  label{font-size:12px}
  .cost .big{font-size:40px}
}
.gauge{position:relative;max-width:300px;margin:0 auto;width:100%}
.gauge svg{width:100%;display:block;overflow:visible}
.arc{fill:none;stroke-width:16;stroke-linecap:round}
.trk{stroke:var(--track)}
#fill{stroke:var(--acc);stroke-dasharray:251.33;stroke-dashoffset:251.33;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .6s}
#needle{transform-origin:100px 100px;transition:transform 1s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg)}
.gl{position:absolute;inset:auto 0 0 0;text-align:center}
.gl b{font-size:34px;font-weight:900;display:block;line-height:1}
.gl small{color:var(--mut);font-size:12px}
.cost{text-align:center}
.cost small{color:var(--mut);font-size:13px}
.cost .big{font-size:46px;font-weight:900;line-height:1.1;color:var(--acc);transition:color .4s}
.cost .big i{font-style:normal;font-size:18px;color:var(--mut);margin-inline-start:6px;font-weight:600}
.cost .fils{font-size:13px;color:var(--mut)}
.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:14px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:14px 8px;border-radius:16px;font:800 15px 'Cairo',sans-serif;color:#fff;background:var(--acc);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.07)}
.btn.pdf{background:#dc2626}
.edit-banner{background:color-mix(in srgb,var(--acc) 12%,transparent);border:1.5px dashed var(--acc);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.edit-banner[hidden]{display:none}
.edit-banner button{margin-inline-start:auto;font-size:12px;background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.st{min-width:0;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.st small{color:var(--mut);font-size:12px;display:block}
.st b{font-size:20px;font-weight:800}
.st em{font-style:normal;font-size:12px;color:var(--mut);margin-inline-start:4px}
.chart{position:relative;direction:ltr;color:var(--mut);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--ink);color:var(--bg1);padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.7;min-width:150px;opacity:0;transition:opacity .15s;z-index:5}
.tip b{font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{text-align:start}
.tbl tr.me td{font-weight:800;background:color-mix(in srgb,var(--acc) 12%,transparent)}
.tbl td.u{color:var(--mut);font-size:11px;border:0;text-align:start}
.tbl .dt{display:block;color:var(--mut);font-size:10px;font-weight:600;margin-top:2px;line-height:1.4}
.chips{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--acc);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.7;background:color-mix(in srgb,var(--acc) 8%,transparent)}
.chip b{display:block;font-size:15px}
.entry{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
.entry.editing{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.entry .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.entry .top b{font-size:15px;overflow-wrap:anywhere}
.entry .top small{color:var(--mut);font-size:12px;flex:none}
.entry .ln{font-size:13px;color:var(--mut);margin:6px 0 10px;line-height:1.8}
.entry .ln strong{color:var(--ink)}
.entry .bt{display:flex;gap:8px;flex-wrap:wrap}
.mini{all:unset;cursor:pointer;font:800 12px 'Cairo',sans-serif;padding:7px 12px;border-radius:10px;border:1.5px solid var(--line);color:var(--ink);box-sizing:border-box}
.mini.pdf{border-color:#dc2626;color:#dc2626}
.mini.edit{border-color:var(--acc);color:var(--acc)}
.mini.del{color:#ef4444;border-color:rgba(239,68,68,.4)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg1);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:18px;line-height:1.8}
#rep{position:fixed;left:-10000px;top:0;width:794px;height:1123px;overflow:hidden;background:#fff;color:#14213d;font-family:'Cairo',system-ui,sans-serif;display:flex;flex-direction:column}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-box{position:relative;width:100%;max-width:400px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-box h3{margin:0 0 6px;font-size:17px;font-weight:900}
.modal-box .note{margin:0 0 4px}
.modal-box .in{margin:12px 0}
.modal-box .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.modal-box .row .btn{flex:1 1 auto;padding:12px 10px;font-size:14px}
.modal-box .row .mini{padding:11px 12px;border-radius:12px;font-size:12px}
.modal-off{font-size:12px;color:var(--mut);margin:4px 0 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">⛽</div>
    <div><h1 data-i18n="title"></h1><p data-i18n="sub"></p></div>
  </header>

  <div class="bar">
    <select id="cur" aria-label="currency"></select>
    <button class="ib" id="theme" type="button" aria-label="theme">🌙</button>
    <button class="ib" id="lang" type="button" aria-label="language">EN</button>
  </div>
  <p class="note" id="cnote" style="margin:-6px 2px 12px"></p>

  <div class="card">
    <label data-i18n="fuelType"></label>
    <div class="fuels" id="fuels"></div>
    <p class="note" id="src"></p>
  </div>

  <div class="card">
    <div class="grid">
      <div class="full"><label data-i18n="car"></label><div class="in"><input id="car" class="txt" type="text" list="cars" maxlength="30" data-ph="carPh"><datalist id="cars"></datalist></div></div>
      <div class="full"><label data-i18n="price"></label>
        <div class="in">
          <input id="price" type="number" step="0.001" inputmode="decimal">
          <span id="uPrice">BHD</span>
          <button class="pencil" id="priceEdit" type="button" aria-label="edit" data-i18n-title="modalTitle">✎</button>
        </div>
      </div>
      <div><label><span data-i18n="tank"></span><button type="button" class="q" id="qbtn" aria-label="help">?</button></label><div class="in"><input id="tank" type="number" value="60" inputmode="decimal"><span data-i18n="L"></span></div></div>
      <div class="full help" id="help" hidden><b data-i18n="helpH"></b><ol id="helpL"></ol></div>
      <div class="full"><label data-i18n="dist"></label><div class="in"><input id="dist" type="number" value="166" inputmode="decimal"><span data-i18n="km"></span></div></div>
      <div>
        <label data-i18n="before"></label>
        <div class="in"><input id="nb" type="number" min="0" max="100" value="100" inputmode="numeric"><span>%</span></div>
        <input id="before" type="range" min="0" max="100" step="1" value="100">
      </div>
      <div>
        <label data-i18n="after"></label>
        <div class="in"><input id="na" type="number" min="0" max="100" value="70" inputmode="numeric"><span>%</span></div>
        <input id="after" type="range" min="0" max="100" step="1" value="70">
      </div>
      <div class="full"><label data-i18n="filled"></label><div class="in"><input id="filled" type="number" step="0.1" placeholder="—" inputmode="decimal"><span data-i18n="L"></span></div></div>
    </div>
  </div>

  <div class="card">
    <div class="hero">
      <div class="gauge">
        <svg viewBox="0 0 200 118" aria-hidden="true">
          <path class="arc trk" d="M20 100 A80 80 0 0 1 180 100"/>
          <path class="arc" id="fill" d="M20 100 A80 80 0 0 1 180 100"/>
          <g id="needle"><line x1="100" y1="100" x2="100" y2="34" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="var(--ink)"/></g>
          <text x="14" y="116" font-size="11" fill="var(--mut)" font-family="Cairo">E</text>
          <text x="178" y="116" font-size="11" fill="var(--mut)" font-family="Cairo">F</text>
        </svg>
        <div class="gl"><b id="left">0</b><small data-i18n="left"></small></div>
      </div>
      <div class="cost">
        <small data-i18n="cost"></small>
        <div class="big"><span id="cost">0.000</span><i id="uCost">BHD</i></div>
        <div class="fils" id="fils"></div>
      </div>
    </div>
  </div>

  <p class="edit-banner" id="editBanner" hidden>
    <span>✏️ <span data-i18n="editingNote"></span></span>
    <button type="button" class="mini" id="cancelEditBtn" data-i18n="cancelEdit"></button>
  </p>

  <div class="actions">
    <button class="btn" id="save" type="button" data-i18n="save"></button>
    <button class="btn pdf" id="pdf" type="button" data-i18n="pdf"></button>
  </div>

  <div class="stats">
    <div class="st"><small data-i18n="used"></small><b id="used">0</b><em data-i18n="L"></em></div>
    <div class="st"><small data-i18n="rate"></small><b id="rate">0</b><em data-i18n="l100"></em></div>
    <div class="st"><small data-i18n="ckm"></small><b id="ckm">0</b><em id="uCkm"></em></div>
    <div class="st"><small data-i18n="full"></small><b id="full">0</b><em id="uFull"></em></div>
    <div class="st"><small data-i18n="rng"></small><b id="range">0</b><em data-i18n="km"></em></div>
    <div class="st"><small data-i18n="pct"></small><b id="pct">0</b><em>%</em></div>
  </div>

  <div class="card">
    <h2 data-i18n="chart"></h2>
    <div class="chart" id="chart"><div id="chartSvg"></div><div class="tip" id="tip"></div></div>
    <p class="note" data-i18n="chartNote"></p>
  </div>

  <div class="card">
    <h2 data-i18n="gcc"></h2>
    <div style="overflow-x:auto"><table class="tbl" id="gccT"></table></div>
    <details class="note"><summary data-i18n="srcs"></summary><ul id="srcL"></ul></details>
  </div>

  <div class="card">
    <h2 data-i18n="log"></h2>
    <div class="chips" id="sum"></div>
    <div id="log"></div>
    <p class="note"><button id="clear" type="button" data-i18n="clear"></button></p>
  </div>

  <footer><span data-i18n="foot"></span><br><span id="updL"></span></footer>
</div>
<div class="toast" id="toast"></div>
<div id="rep"></div>

<div class="modal" id="priceModal" hidden>
  <div class="modal-bg" id="mpBg"></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mpTitle">
    <h3 id="mpTitle" data-i18n="modalTitle"></h3>
    <p class="note" data-i18n="modalNote"></p>
    <div class="in">
      <input id="mpInput" type="number" step="0.001" inputmode="decimal">
      <span id="mpUnit">BHD</span>
    </div>
    <p class="modal-off"><span data-i18n="officialIs"></span>: <b id="mpCurrent">—</b></p>
    <div class="row">
      <button class="btn" id="mpSave" type="button" data-i18n="modalSave"></button>
      <button class="mini" id="mpReset" type="button" data-i18n="resetOfficial"></button>
      <button class="mini" id="mpCancel" type="button" data-i18n="modalCancel"></button>
    </div>
  </div>
</div>

<script>
/* ============ أدوات ============ */
const $=id=>document.getElementById(id);
const num=id=>parseFloat($(id).value)||0;
const clamp=v=>Math.min(100,Math.max(0,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}

/* ============ الترجمة ============ */
const I={
ar:{title:'حاسبة البنزين',sub:'مملكة البحرين',fuelType:'نوع البنزين',g91:'جيد',g95:'ممتاز',g98:'سوبر',fils:'فلس',
 car:'اسم السيارة',carPh:'مثال: كامري V6',price:'سعر اللتر – يدوي',tank:'سعة الخزان',L:'لتر',dist:'المسافة التي قطعتها',km:'كم',
 before:'المؤشر قبل',after:'المؤشر بعد',filled:'اختياري: كم لتر عبّأت بعد المشوار؟ (للدقة)',
 helpH:'من أين أعرف سعة الخزان؟',

function fmtDate(d){
  if(!d)return'';
  const m=String(d).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if(!m)return d;
  const mi=parseInt(m[2])-1;
  if(mi<0||mi>11)return d;
  if(lang==='ar')return m[3]?`${parseInt(m[3])} ${MONTHS_AR[mi]}`:MONTHS_AR[mi];
  return m[3]?`${MONTHS_EN[mi]} ${m[3]}`:MONTHS_EN[mi];
}

/* ============ Sparkline ============ */
function sparkline(g){
  const all=D.bahrain.history.filter(x=>x['p'+g]!=null);
  if(all.length<2)return'';
  const H=all.slice(-6).map(x=>x['p'+g]);
  const w=76,h=18,pad=2;
  const mn=Math.min(...H),mx=Math.max(...H),sp=(mx-mn)||0.001;
  const X=i=>pad+i/(H.length-1)*(w-2*pad);
  const Y=v=>h-pad-(v-mn)/sp*(h-2*pad);
  let d='M'+X(0).toFixed(1)+' '+Y(H[0]).toFixed(1);
  for(let i=1;i<H.length;i++)d+=' L'+X(i).toFixed(1)+' '+Y(H[i]).toFixed(1);
  const lx=X(H.length-1).toFixed(1),ly=Y(H[H.length-1]).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="2.2" fill="currentColor"/></svg>`;
}

function trend(g){

  const last=H[H.length-1]['p'+g],prev=H[H.length-2]['p'+g];

  if(last>prev)return{icon:'▲',cls:'trend-up'};

}

/* ============ الحساب ============ */
function calc(){
  const price=num('price'),tank=num('tank'),dist=num('dist'),filled=num('filled');
  const b=clamp(num('nb')),a=clamp(num('na'));
  const used=filled>0?filled:Math.max(tank*(b-a)/100,0);
  const cons=dist>0?used/dist*100:0;
  const left=filled>0?Math.max(tank*b/100-filled,0):tank*a/100;
  const lvl=tank>0?Math.min(left/tank,1):0;
  const cost=used*price;
  R={price,tank,dist,used,cons,cost,left,g:cf.g};
  const u=unit(cur);
  $('cost').textContent=cc(cost);$('uCost').textContent=u;
  $('fils').textContent=cur==='BHD'?'≈ '+Math.round(cost*1000)+' '+t('fils'):'≈ '+cost.toFixed(3)+' BHD';
  $('used').textContent=used.toFixed(1);
  $('rate').textContent=cons.toFixed(1);
  if(cur==='BHD'){$('ckm').textContent=dist>0?(cost/dist*1000).toFixed(1):'0';$('uCkm').textContent=t('fils')}
  else{$('ckm').textContent=dist>0?conv(cost/dist,'BHD',cur).toFixed(dec(cur)+1):'0';$('uCkm').textContent=u}
  $('full').textContent=cc(tank*price);$('uFull').textContent=u;
  $('range').textContent=cons>0?Math.round(tank/cons*100):0;
  $('pct').textContent=tank>0?Math.min(used/tank*100,100).toFixed(0):'0';
  $('left').textContent=left.toFixed(1);
  $('fill').style.strokeDashoffset=251.33*(1-lvl);
  $('needle').style.transform='rotate('+(-90+180*lvl)+'deg)';
  $('fill').style.stroke=lvl<.2?'#ef4444':lvl<.4?'#f59e0b':cf.c;
}
['price','tank','dist','filled'].forEach(i=>$(i).addEventListener('input',calc));

/* ============ الرسم البياني ============ */
function chartSVG(g,w,h,color,uid,bg){
  const H=D.bahrain.history.map(x=>({d:Date.parse(x.date+'T00:00:00Z'),v:x['p'+g],h:x})).filter(x=>x.v!=null);
  if(H.length<2)return null;
  const L=54,Rr=14,T=12,B=26;
  const t0=H[0].d,t1=Math.max(Date.parse(D.updated+'T00:00:00Z')||0,H[H.length-1].d);
  const vs=H.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||0.01;
  const lo=mn-sp*.2,hi=mx+sp*.2;
  const X=d=>L+(d-t0)/(t1-t0)*(w-L-Rr);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(h-T-B);
  let d='M'+X(H[0].d).toFixed(1)+' '+Y(H[0].v).toFixed(1);
  for(let i=1;i<H.length;i++){d+=' L'+X(H[i].d).toFixed(1)+' '+Y(H[i-1].v).toFixed(1)+' L'+X(H[i].d).toFixed(1)+' '+Y(H[i].v).toFixed(1)}
  d+=' L'+X(t1).toFixed(1)+' '+Y(H[H.length-1].v).toFixed(1);
  const area=d+' L'+X(t1).toFixed(1)+' '+(h-B)+' L'+X(t0).toFixed(1)+' '+(h-B)+' Z';
  let grid='';
  for(let k=0;k<4;k++){
    const v=lo+(hi-lo)*k/3,y=Y(v).toFixed(1);
    grid+='<line x1="'+L+'" x2="'+(w-Rr)+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".18"/>'
      +'<text x="'+(L-6)+'" y="'+(+y+4)+'" font-size="11" text-anchor="end" fill="currentColor">'+cc(v)+'</text>';
  }
  let xt='';
  for(let m=new Date(Date.UTC(new Date(t0).getUTCFullYear(),new Date(t0).getUTCMonth(),1));m.getTime()<=t1;m.setUTCMonth(m.getUTCMonth()+6)){
    xt+='<text x="'+X(m.getTime()).toFixed(1)+'" y="'+(h-6)+'" font-size="11" text-anchor="middle" fill="currentColor">'+m.getUTCFullYear()+'-'+String(m.getUTCMonth()+1).padStart(2,'0')+'</text>';
  }
  const pts=H.map(p=>({x:X(p.d),y:Y(p.v),v:p.v,h:p.h}));
  const dots=pts.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4.5" fill="'+color+'" style="stroke:'+bg+';stroke-width:2"/>').join('');
  const hv=uid==='p'?'<g id="hv" style="display:none"><line id="hvl" y1="'+T+'" y2="'+(h-B)+'" stroke="'+color+'" stroke-dasharray="3 3"/><circle id="hvc" r="8" fill="'+color+'" style="stroke:'+bg+';stroke-width:3"/></g>':'';
  const svg='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" font-family="Cairo,sans-serif" style="width:100%;display:block">'
    +'<defs><linearGradient id="gr'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +grid+xt+'<path d="'+area+'" fill="url(#gr'+uid+')"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>'+dots+hv+'</svg>';
  return {svg,pts,w,h};
}

function tipAt(e){
  if(!chartCtx)return;
  const svg=$('chartSvg').querySelector('svg');if(!svg)return;
  const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*chartCtx.w;
  let bi=0,bd=1e9;
  chartCtx.pts.forEach((p,i)=>{const dd=Math.abs(p.x-px);if(dd<bd){bd=dd;bi=i}});
  const p=chartCtx.pts[bi],pv=bi>0?chartCtx.pts[bi-1]:null;
  const hv=$('hv');hv.style.display='';
  $('hvl').setAttribute('x1',p.x);$('hvl').setAttribute('x2',p.x);
  $('hvc').setAttribute('cx',p.x);$('hvc').setAttribute('cy',p.y);
  const dd=cur==='BHD'?3:dec(cur)+1,u=unit(cur);
  const f=v=>conv(v,'BHD',cur).toFixed(dd)+' '+u;
  let html='<b>'+esc(p.h.date)+'</b><br>'+esc(t('tPrice'))+': '+f(p.v);
  if(pv){
    const diff=p.v-pv.v,pct=diff/pv.v*100;
    html+='<br>'+esc(t('tPrev'))+': '+f(pv.v)+'<br>'+esc(t('tChg'))+': '+(diff>0?'▲ +':diff<0?'▼ −':'= ')+Math.abs(conv(diff,'BHD',cur)).toFixed(dd)+' ('+(diff>0?'+':diff<0?'−':'')+Math.abs(pct).toFixed(1)+'%)';
  }
  const n=p.h['n_'+lang];if(n)html+='<br><i>'+esc(n)+'</i>';
  const tip=$('tip');tip.dir=lang==='ar'?'rtl':'ltr';tip.innerHTML=html;tip.style.opacity=1;
  const px2=p.x/chartCtx.w*r.width,wd=tip.offsetWidth;
  tip.style.left=Math.max(0,Math.min(r.width-wd,px2-wd/2))+'px';
}
const chartEl=$('chart');
chartEl.addEventListener('pointerdown',tipAt);
chartEl.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)tipAt(e)});
chartEl.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideTip()});

/* ============ مقارنة الخليج ============ */
function gccRows(){
  const rows=D.gcc.map(c=>({c,v:['p91','p95','p98'].map(k=>c[k]==null?null:conv(c[k],c.cur,cur))}));
  rows.sort((a,b)=>(a.v[1]==null?1e12:a.v[1])-(b.v[1]==null?1e12:b.v[1]));
  return rows;
}
function renderGcc(){
  const T=$('gccT');
  if(!D.gcc.length){T.innerHTML='<tr><td>'+esc(t('noData'))+'</td></tr>';$('srcL').innerHTML='';return}
  let h='<tr><th>'+esc(t('ctry'))+'</th><th>91</th><th>95</th><th>98</th></tr>';
  gccRows().forEach(r=>{
    const dt=r.c.date?'<small class="dt">'+esc(fmtDate(r.c.date))+'</small>':'';
    h+='<tr'+(r.c.id==='BH'?' class="me"':'')+'><td>'+esc(r.c[lang]||r.c.en)+dt+'</td>'
      +r.v.map(v=>'<td'+(v==null?' title="'+esc(t('notAvail'))+'"':'')+'>'+(v==null?'—':fmt(v,cur))+'</td>').join('')+'</tr>';
  });
  T.innerHTML=h+'<tr><td colspan="4" class="u">'+esc(unit(cur))+' / '+esc(t('L'))+'</td></tr>';
  $('srcL').innerHTML=(D.notes||[]).map(n=>'<li>'+esc(n[lang]||n.ar||'')+'</li>').join('');
}

/* ============ السجل + التعديل ============ */
const carName=()=>$('car').value.trim()||(lang==='ar'?'سيارتي':'My car');
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function updateSaveBtn(){
  const btn=$('save');
  if(btn)btn.textContent=editId?t('updateEntry'):t('save');
  const banner=$('editBanner');
  if(banner)banner.hidden=!editId;
}

function loadEntry(e){
  if(!e.tank||e.tank<=0){toast(t('cantLoad'));return}
  editId=e.id||null;
  // car
  $('car').value=e.car||'';
  LS.set('lastCar',e.car||'');
  // fuel type
  const f=FUELS.find(x=>x.g===e.g)||FUELS[0];
  pick(f);
  // tank
  $('tank').value=e.tank;
  LS.set('lastTank',e.tank);
  // distance
  $('dist').value=e.dist||0;
  // price (set directly, no manual-save side effect)
  $('price').value=(e.price||0).toFixed(3);
  // reconstruct before/after %
  let a=(e.left||0)/e.tank*100;
  let b=((e.left||0)+(e.used||0))/e.tank*100;
  a=Math.max(0,Math.min(100,a));
  b=Math.max(a,Math.min(100,b));
  const aR=Math.round(a),bR=Math.round(b);
  $('na').value=aR;$('after').value=aR;
  $('nb').value=bR;$('before').value=bR;
  $('filled').value='';
  calc();
  updateSaveBtn();
  renderLog();
  toast(t('loadedForEdit'));
  try{window.scrollTo({top:0,behavior:'smooth'})}catch(_){window.scrollTo(0,0)}
}

function cancelEdit(){
  editId=null;
  updateSaveBtn();
  renderLog();
  toast(t('editCancelled'));
}
$('cancelEditBtn').onclick=cancelEdit;

$('save').onclick=()=>{
  if(!(R.dist>0&&R.used>0)){toast(t('need'));return}
  const l=getLog();
  const entry={
    id:editId||Date.now(),
    car:carName(),
    date:new Date().toLocaleDateString('en-GB'),
    g:R.g,price:R.price,dist:R.dist,
    used:R.used,cost:R.cost,cons:R.cons,
    tank:R.tank,left:R.left
  };
  if(editId){
    const idx=l.findIndex(x=>x.id===editId);
    if(idx>=0){entry.date=l[idx].date;l[idx]=entry}
    else l.unshift(entry);
    editId=null;
    setLog(l);renderLog();updateSaveBtn();
    toast(t('updated'));
  }else{
    l.unshift(entry);
    setLog(l);renderLog();
    toast(t('saved'));
  }
};

function renderLog(){
  const l=getLog(),u=unit(cur);
  const dl=$('cars');dl.innerHTML='';
  [...new Set(l.map(e=>e.car))].forEach(n=>{const o=document.createElement('option');o.value=n;dl.appendChild(o)});
  const sum=$('sum');sum.innerHTML='';
  const by={};
  l.forEach(e=>{const s=by[e.car]||(by[e.car]={d:0,u:0,c:0,n:0});s.d+=e.dist;s.u+=e.used;s.c+=e.cost;s.n++});
  Object.keys(by).forEach(k=>{
    const s=by[k],c=el('div','chip');
    c.appendChild(el('b','',k));
    c.appendChild(el('span','',t('avg')+' '+(s.d>0?(s.u/s.d*100).toFixed(1):'0')+' '+t('l100')+' · '+s.n+' '+t('trips')+' · '+cc(s.c)+' '+u));
    sum.appendChild(c);
  });
  const lg=$('log');lg.innerHTML='';
  if(!l.length)lg.appendChild(el('p','note',t('empty')));
  l.forEach(e=>{
    const row=el('div','entry');
    if(editId===e.id)row.classList.add('editing');
    const top=el('div','top');
    top.appendChild(el('b','','🚗 '+e.car));top.appendChild(el('small','',e.date));
    const ln=el('div','ln');
    ln.innerHTML=esc(t('rFuel'))+' <strong></strong> · <strong></strong> '+esc(t('km'))+' · <strong></strong> '+esc(t('L'))+' · <strong></strong> '+esc(u)+' · <strong></strong> '+esc(t('l100'));
    const st=ln.querySelectorAll('strong');
    st[0].textContent=e.g;st[1].textContent=(+e.dist).toFixed(0);st[2].textContent=e.used.toFixed(1);st[3].textContent=cc(e.cost);st[4].textContent=e.cons.toFixed(1);
    const bt=el('div','bt');
    const ed=el('button','mini edit',t('edit'));ed.type='button';ed.onclick=()=>loadEntry(e);
    const p=el('button','mini pdf','📄 PDF');p.type='button';p.onclick=()=>makePDF(e);
    const d=el('button','mini del',t('del'));d.type='button';d.onclick=()=>{
      if(editId===e.id){editId=null;updateSaveBtn()}
      setLog(getLog().filter(x=>x.id!==e.id));renderLog();
    };
    bt.appendChild(ed);bt.appendChild(p);bt.appendChild(d);
    row.appendChild(top);row.appendChild(ln);row.appendChild(bt);
    lg.appendChild(row);
  });
  $('clear').style.display=l.length?'':'none';
}
$('clear').onclick=()=>{
  if(confirm(t('confirmClear'))){
    setLog([]);
    editId=null;updateSaveBtn();
    renderLog();
  }
};
$('car').addEventListener('input',()=>{
  const n=$('car').value.trim();LS.set('lastCar',n);
  const hit=getLog().find(e=>e.car===n);
  if(hit&&hit.tank>0){$('tank').value=hit.tank;LS.set('lastTank',hit.tank);calc()}
});
$('tank').addEventListener('input',()=>LS.set('lastTank',num('tank')));
$('qbtn').onclick=()=>{const h=$('help');h.hidden=!h.hidden};

/* ============ تقرير PDF ============ */
function reportHTML(o){
  const ar=lang==='ar',col=(FUELS.find(f=>f.g===o.g)||FUELS[0]).c,u=unit(cur);
  const cell=(l,v,s)=>'<div style="border:1px solid #e3e8ef;border-radius:14px;padding:10px 14px;background:#f8fafc"><div style="font-size:12px;color:#5c6678">'+l+'</div><div style="font-size:22px;font-weight:900;color:#14213d;margin-top:2px">'+v+(s?'<span style="font-size:12px;font-weight:600;color:#5c6678;margin-inline-start:5px">'+s+'</span>':'')+'</div></div>';
  const rng=o.cons>0?Math.round(o.tank/o.cons*100):0;
  const ckm=o.dist>0?o.cost/o.dist:0;
  const lvl=(o.left!=null&&o.tank>0)?Math.max(0,Math.min(1,o.left/o.tank)):null;
  const ckmTxt=cur==='BHD'?cell(esc(t('ckm')),(ckm*1000).toFixed(1),esc(t('fils'))):cell(esc(t('ckm')),conv(ckm,'BHD',cur).toFixed(dec(cur)+1),esc(u));
  const perL=cur==='BHD'?Math.round(o.price*1000)+' '+t('fils'):cc(o.price)+' '+u;
  const ch=chartSVG(o.g,714,190,col,'r','#ffffff');
  const rows=gccRows().map(r=>{
    const dt=r.c.date?'<small style="display:block;color:#5c6678;font-size:10px;font-weight:600">'+esc(fmtDate(r.c.date))+'</small>':'';
    return '<tr style="'+(r.c.id==='BH'?'background:'+col+'18;font-weight:800':'')+'"><td style="padding:3px 10px;text-align:start">'+esc(r.c[lang]||r.c.en)+dt+'</td>'+r.v.map(v=>'<td style="padding:3px 10px;text-align:center">'+(v==null?'—':fmt(v,cur))+'</td>').join('')+'</tr>';
  }).join('');
  const bar=lvl==null?'':'<div style="margin:0 40px 14px"><div style="font-size:12px;color:#5c6678;margin-bottom:5px">'+esc(t('rGauge'))+' · '+o.left.toFixed(1)+' '+esc(t('L'))+' ('+Math.round(lvl*100)+'%)</div><div style="height:16px;border-radius:9px;background:#e6ebf1;overflow:hidden"><div style="height:100%;width:'+Math.round(lvl*100)+'%;background:'+(lvl<.2?'#ef4444':lvl<.4?'#f59e0b':col)+';border-radius:9px"></div></div></div>';
  return ''
  +'<div style="background:linear-gradient(135deg,'+col+',#0b1220);color:#fff;padding:30px 40px 66px;flex:none">'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:34px;font-weight:900">⛽ '+esc(t('rTitle'))+'</div><div style="font-size:14px;opacity:.9">'+esc(o.date)+'</div></div>'
    +'<div style="margin-top:12px;display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:5px 16px;font-size:16px;font-weight:800">🚗 '+esc(o.car)+'</div>'
  +'</div>'
  +'<div style="margin:-44px 40px 18px;background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(20,33,61,.18);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex:none">'
    +'<div><div style="font-size:13px;color:#5c6678">'+esc(t('cost'))+'</div><div style="font-size:54px;font-weight:900;line-height:1.1;color:'+col+'">'+cc(o.cost)+'<span style="font-size:18px;color:#5c6678;font-weight:600;margin-inline-start:8px">'+esc(u)+'</span></div>'
    +(cur==='BHD'?'':'<div style="font-size:12px;color:#5c6678">'+esc(t('rEq'))+': '+o.cost.toFixed(3)+' BHD</div>')+'</div>'
    +'<div style="text-align:center;border-inline-start:2px solid #e6ebf1;padding-inline-start:24px"><div style="font-size:12px;color:#5c6678">'+esc(t('rFuel'))+'</div><div style="font-size:40px;font-weight:900;color:'+col+';line-height:1">'+o.g+'</div><div style="font-size:12px;color:#5c6678">'+esc(t('g'+o.g))+'</div><div style="font-size:13px;font-weight:800;margin-top:4px">'+esc(perL)+' / '+esc(t('rPer'))+'</div></div>'
  +'</div>'
  +'<div style="margin:0 40px 14px;font-size:15px;font-weight:900;flex:none">'+esc(t('rTrip'))+'</div>'
  +'<div style="margin:-6px 40px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none">'
    +cell(esc(t('dist')),(+o.dist).toFixed(0),esc(t('km')))
    +cell(esc(t('used')),o.used.toFixed(1),esc(t('L')))
    +cell(esc(t('rate')),o.cons.toFixed(1),esc(t('l100')))
    +ckmTxt
    +cell(esc(t('full')),cc(o.tank*o.price),esc(u))
    +cell(esc(t('rng')),rng,esc(t('km')))
  +'</div>'
  +bar
  +'<div style="margin:0 40px 4px;font-size:15px;font-weight:900;flex:none">'+esc(t('chart'))+'</div>'
  +'<div style="margin:0 40px 12px;direction:ltr;color:#5c6678;flex:none">'+(ch?ch.svg:'')+'</div>'
  +'<div style="margin:0 40px 4px;font-size:15px;font-weight:900;flex:none">'+esc(t('gcc'))+'</div>'
  +'<table style="margin:0 40px;width:714px;border-collapse:collapse;font-size:13px;flex:none"><tr style="background:#eef2f7"><th style="padding:4px 10px;text-align:start">'+esc(t('ctry'))+'</th><th>91</th><th>95</th><th>98</th></tr>'+rows+'</table>'
  +'<div style="margin:3px 40px 0;font-size:11px;color:#5c6678;flex:none">'+esc(u)+' / '+esc(t('L'))+'</div>'
  +'<div style="margin:auto 40px 0;padding:10px 0 18px;border-top:1px solid #e3e8ef;font-size:10.5px;color:#5c6678;line-height:1.7;flex:none">'+esc(t('rDisc'))+' · '+esc(t('upd'))+': '+esc(D.updated)+'</div>';
}
async function makePDF(o){
  toast(t('making'));
  try{
    if(!window.html2canvas||!window.jspdf)throw new Error('libs');
    const box=$('rep');box.dir=lang==='ar'?'rtl':'ltr';box.innerHTML=reportHTML(o);
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await html2canvas(box,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:794,
      onclone:d=>{const e=d.getElementById('rep');e.style.left='0';e.style.position='absolute'}});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297);
    const blob=pdf.output('blob'),name='fuel-report-'+Date.now()+'.pdf';
    const file=new File([blob],name,{type:'application/pdf'});
    const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:t('rTitle')})}catch(e){if(!e||e.name!=='AbortError')dl()}
    }else dl();
  }catch(e){toast(t('pdfFail'))}
  finally{$('rep').innerHTML=''}
}
$('pdf').onclick=()=>{
  if(!(R.dist>0&&R.used>0)){toast(t('need'));return}
  makePDF({car:carName(),date:new Date().toLocaleDateString('en-GB'),g:R.g,price:R.price,dist:R.dist,used:R.used,cost:R.cost,cons:R.cons,tank:R.tank,left:R.left});
};

/* ============ الثيم واللغة ============ */
const mq=window.matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>{const a=document.documentElement.getAttribute('data-theme');return a?a==='dark':mq.matches};
function applyTheme(m){if(m)document.documentElement.setAttribute('data-theme',m);$('theme').textContent=isDark()?'☀️':'🌙'}
$('theme').onclick=()=>{const m=isDark()?'light':'dark';LS.set('theme',m);applyTheme(m)};
if(mq.addEventListener)mq.addEventListener('change',()=>applyTheme(null));

  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));

$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';LS.set('lang',lang);applyLang()};

/* ============ التحميل ============ */
async function loadData(){
  try{
    const r=await fetch('prices.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('http');
    const j=await r.json();
    if(!j.bahrain||!Array.isArray(j.bahrain.history)||!j.bahrain.history.length||!Array.isArray(j.currencies))throw new Error('shape');
    D=j;loaded=true;
  }catch(e){loaded=false}
  applyLang();pick(cf);
}
$('car').value=LS.get('lastCar','');
const lt=LS.get('lastTank',0);if(lt>0)$('tank').value=lt;
applyTheme(LS.get('theme',null));
applyLang();pick(FUELS[0]);
loadData();
</script>
